name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t h7hal-build Tools/h7hal-build

      - name: Build firmware
        run: |
          docker run --rm -v "$PWD":/project h7hal-build bash -c \
            "cmake -S . -B build/docker -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake \
              -DCMAKE_BUILD_TYPE=Debug \
            && cmake --build build/docker"

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: firmware-debug
          path: |
            build/docker/*.elf
            build/docker/*.map